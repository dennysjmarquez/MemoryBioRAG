name: BioRAG CI

on:
  push:
    branches: [ master, main, "arena/**" ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Pytest Unit Tests
        run: |
          python -m pytest tests/ -v

      - name: Verify Scoring Invariants
        run: |
          python scripts/test_regresion_scoring.py

      - name: Verify Concept Hub 5-Angles
        run: |
          python scripts/test_concept_hub.py

  sqlite-portability:
    name: SQLite and daemon locking (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify SQLite canonical paths
        run: python -m pytest tests/test_sqlite_paths.py -q

      - name: Verify SQLite consumer classifications
        run: python -m pytest tests/test_sqlite_runtime.py::test_consumidores_de_produccion_usan_aperturas_clasificadas -q

      - name: Verify SQLite read-only diagnostics
        run: python -m pytest tests/test_sqlite_runtime.py::test_open_reader_es_readonly_y_emite_diagnostico_sin_ruta_cruda -q

      - name: Verify SQLite commit epoch tracking
        run: python -m pytest tests/test_sqlite_runtime.py::test_open_writer_registra_commit_cooperativo_por_ruta -q

      - name: Verify SQLite writer diagnostics
        run: python -m pytest tests/test_sqlite_runtime.py::test_open_writer_registra_consumidor_runtime_y_timeout -q

      - name: Verify SQLite WAL safety policy
        run: >-
          python -m pytest
          tests/test_sqlite_runtime.py::test_clasifica_runtime_afectado_por_wal_reset
          tests/test_sqlite_runtime.py::test_runtime_vulnerable_usa_delete_en_base_nueva
          tests/test_sqlite_runtime.py::test_runtime_vulnerable_transicion_wal_a_delete_conserva_filas
          tests/test_sqlite_runtime.py::test_runtime_vulnerable_no_degrada_wal_si_otra_conexion_sigue_abierta
          tests/test_sqlite_runtime.py::test_base_wal_existente_no_se_cambia_sin_opt_in
          tests/test_sqlite_runtime.py::test_almacen_principal_y_dmn_aplican_la_misma_politica
          tests/test_sqlite_runtime.py::test_runtime_corregido_conserva_wal_y_memoria_no_se_fuerza_a_wal -q

      - name: Verify SQLite generations, sidecars and retained handles
        run: python -m pytest tests/test_sqlite_generation.py -q

      - name: Verify daemon locks across processes
        run: python -m pytest tests/test_daemon_lifecycle.py -q
