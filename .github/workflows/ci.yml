name: BioRAG CI

on:
  push:
    branches: [ master, main, "arena/**" ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Pytest Unit Tests
        run: |
          python -m pytest tests/ -v

      - name: Verify Scoring Invariants
        run: |
          python scripts/test_regresion_scoring.py

      - name: Verify Concept Hub 5-Angles
        run: |
          python scripts/test_concept_hub.py

  sqlite-portability:
    name: SQLite and daemon locking (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify SQLite relative and environment paths
        run: python -m pytest tests/test_sqlite_paths.py::test_ruta_relativa_se_resuelve_desde_cwd_sin_crear_archivos tests/test_sqlite_paths.py::test_argumento_explicito_gana_y_se_canoniza -q

      - name: Verify SQLite symlink canonicalization
        run: python -m pytest tests/test_sqlite_paths.py::test_alias_symlink_y_ruta_real_convergen -q

      - name: Verify SQLite store canonical path
        run: python -m pytest tests/test_sqlite_paths.py::test_motor_abre_y_expone_ruta_canonica_para_path_relativo -q

      - name: Verify SQLite URI preservation
        run: python -m pytest tests/test_sqlite_paths.py::test_memory_uri_y_sqlite_uri_se_preservan -q

      - name: Verify SQLite runtime policy
        run: python -m pytest tests/test_sqlite_runtime.py -q

      - name: Verify SQLite generations, sidecars and retained handles
        run: python -m pytest tests/test_sqlite_generation.py -q

      - name: Verify daemon locks across processes
        run: python -m pytest tests/test_daemon_lifecycle.py -q
